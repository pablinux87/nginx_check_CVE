# Ejemplo: migrar rewrite vulnerable a capturas nombradas (CVE-2026-42945)
# Revisar cada bloque server/location manualmente antes de reload.

# Vulnerable:
# rewrite ^/users/([0-9]+)/profile/(.*)$ /profile.php?id=$1&tab=$2 last;

# Mitigado:
rewrite ^/users/(?<user_id>[0-9]+)/profile/(?<section>.*)$ /profile.php?id=$user_id&tab=$section last;
